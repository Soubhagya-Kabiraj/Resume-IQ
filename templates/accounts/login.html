{% extends "base.html" %}

{% block title %}Sign In - ResumeIQ{% endblock %}

{% block content %}
<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 75vh;">
    <div class="card-glass auth-card shadow-lg position-relative overflow-hidden">
        <!-- Glow Orbs -->
        <div style="position: absolute; width: 150px; height: 150px; background: rgba(99, 102, 241, 0.3); filter: blur(60px); top: -40px; right: -40px; border-radius: 50%;"></div>
        
        <div class="text-center mb-4 position-relative z-1">
            <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="bi bi-cpu-fill"></i>
            </div>
            <h2 class="text-white fw-bold mb-1">Welcome Back</h2>
            <p class="text-muted small">Sign in to access your ResumeIQ dashboard</p>
        </div>

        <form method="POST" class="position-relative z-1">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label-custom">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-70 border-secondary border-opacity-25 text-muted">
                        <i class="bi bi-person"></i>
                    </span>
                    <input class="form-control form-control-dark" type="text" name="username" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label-custom">Password</label>

                <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-70 border-secondary border-opacity-25 text-muted">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input class="form-control form-control-dark" type="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-glow w-100 py-3 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Dashboard
            </button>

            <div class="text-center">
                <p class="text-muted small mb-0">
                    Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-semibold text-decoration-none">Register here</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
