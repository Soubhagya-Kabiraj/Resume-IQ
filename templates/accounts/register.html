{% extends "base.html" %}

{% block title %}Create Account - ResumeIQ{% endblock %}

{% block content %}
<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card-glass auth-card shadow-lg position-relative overflow-hidden">
        <!-- Glow Orbs -->
        <div style="position: absolute; width: 150px; height: 150px; background: rgba(217, 70, 239, 0.25); filter: blur(60px); top: -40px; left: -40px; border-radius: 50%;"></div>
        
        <div class="text-center mb-4 position-relative z-1">
            <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem; background: var(--grad-accent);">
                <i class="bi bi-rocket-takeoff-fill"></i>
            </div>
            <h2 class="text-white fw-bold mb-1">Create Account</h2>
            <p class="text-muted small">Start analyzing your resumes with AI in seconds</p>
        </div>

        <form method="POST" class="position-relative z-1">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label-custom">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-70 border-secondary border-opacity-25 text-muted">
                        <i class="bi bi-person"></i>
                    </span>
                    <input class="form-control form-control-dark" type="text" name="username" placeholder="Choose a username" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label-custom">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-70 border-secondary border-opacity-25 text-muted">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input class="form-control form-control-dark" type="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label-custom">Password</label>

                <div class="input-group">
                    <span class="input-group-text bg-dark bg-opacity-70 border-secondary border-opacity-25 text-muted">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input class="form-control form-control-dark" type="password" name="password" placeholder="Create a password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-glow w-100 py-3 mb-3">
                <i class="bi bi-person-plus-fill me-2"></i> Register Account
            </button>

            <div class="text-center">
                <p class="text-muted small mb-0">
                    Already registered? <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
